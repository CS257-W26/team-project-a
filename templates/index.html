<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Usage Statistics</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='datastyle.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-brand">Water Stats</a>
            <ul class="nav-menu">
                <li><a href="/" class="nav-link">Home</a></li>
                <li><a href="/about" class="nav-link">About</a></li>
            </ul>
        </div>
    </nav>

    <main class="page">
        <div class="card">
            <h1>Water Usage by Country</h1>
            <p class="subtitle">Select a country to view water usage statistics.</p>

            <form method="POST" class="form">
                <label for="country">Choose a Country:</label>
                <select id="country" name="country">
                    <option value="">Select</option>
                    {% for name in names %}
                    <option value="{{ name }}" {% if name == selected_name %}selected{% endif %}>
                        {{ name }}
                    </option>
                    {% endfor %}
                </select>
                <button type="submit">Search</button>
            </form>

            <form method="POST" class="form">
                <label for="year">Choose a Year:</label>
                <select id="year" name="year">
                    <option value="">Select</option>
                    {%for year in range(2000,2024)%}
                    <option value="{{ year }}">{{ year }}</option>
                    {% endfor %}
            </form>

            {% if error %}
            <p class="error">{{ error }}</p>
            {% endif %}
        </div>

        {% if country %}
        <div class="card">
            <h2>{{ country.name }}</h2>
            <p class="subtitle">Year: {{ country.year }}</p>

            <div class="stats-grid">
                <div class="stat">
                    <span class="stat-label">Per Capita</span>
                    <span class="stat-value">{{ country.per_capita }}</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Agricultural</span>
                    <span class="stat-value">{{ agricultural }}%</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Industrial</span>
                    <span class="stat-value">{{ industrial }}%</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Household</span>
                    <span class="stat-value">{{ household }}%</span>
                </div>
            </div>

            <a href="/country/{{ country.name }}" class="detail-link">View Full Details</a>
        </div>
        {% endif %}
    </main>
</body>
</html>
